name: Deploy PROJECT BADGER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rebuild/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: rebuild
      - name: Verify the story
        run: npm test
        working-directory: rebuild
      - name: Build the website and offline copy
        run: npm run build
        working-directory: rebuild
      - name: Prepare the public files
        run: node github/stage-pages.mjs "$RUNNER_TEMP/badger-pages"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/badger-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out the QR generator
        uses: actions/checkout@v4
      - name: Set up Node.js for QR verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rebuild/package-lock.json
      - name: Install locked QR dependencies
        run: npm ci
        working-directory: rebuild
      - name: Verify the live page and create its QR code
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node github/make-qr.mjs "$PAGES_URL" "$RUNNER_TEMP/badger-qr"
      - name: Save printable QR files
        uses: actions/upload-artifact@v4
        with:
          name: badger-19-qr
          path: ${{ runner.temp }}/badger-qr
